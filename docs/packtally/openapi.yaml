openapi: 3.1.0
info:
  title: PackTally API
  version: 0.1.0-prelaunch
  description: Prelaunch contract. It may change until the first production release; afterward breaking changes require a compatibility path.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      security: []
      responses:
        '200': { $ref: '#/components/responses/CapabilitiesResponse' }
  /setup/owner:
    post:
      operationId: bootstrapOwner
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SetupOwner' }
      responses:
        '201': { $ref: '#/components/responses/AccountResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /invitations/{token}/claim:
    post:
      operationId: claimInvitation
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ClaimInvitation' }
      responses:
        '201': { $ref: '#/components/responses/AccountResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /auth/options:
    post:
      operationId: createAuthenticationOptions
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/LoginOptions' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /auth/verify:
    post:
      operationId: verifyAuthentication
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/WebAuthnVerify' }
      responses:
        '200': { $ref: '#/components/responses/AccountResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /sessions:
    get:
      operationId: listSessions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /passkeys/register/options:
    post:
      operationId: createPasskeyRegistrationOptions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /passkeys/register/verify:
    post:
      operationId: verifyPasskeyRegistration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/WebAuthnVerify' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /passkeys/{passkeyId}:
    delete:
      operationId: revokePasskey
      parameters:
        - $ref: '#/components/parameters/PasskeyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /accounts/me:
    delete:
      operationId: deleteCurrentAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonMutation' }
      responses:
        '202': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /sessions/{sessionId}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips:
    get:
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /legacy-recaps:
    get:
      operationId: listLegacyRecaps
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /legacy-recaps/{month}:
    get:
      operationId: getLegacyRecap
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /legacy-recaps/{month}/pdf:
    get:
      operationId: downloadLegacyRecapPdf
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Legacy recap PDF using original semantics
          content:
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createTrip
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/TripMutation' }
      responses:
        '201': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}:
    get:
      operationId: getTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      operationId: updateTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/TripMutation' }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/invitations:
    post:
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/members/{memberId}:
    patch:
      operationId: updateTripMember
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MemberMutation' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/lifecycle:
    post:
      operationId: transitionTripLifecycle
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/LifecycleMutation' }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/deletion:
    post:
      operationId: requestTripDeletion
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonMutation' }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      operationId: cancelTripDeletion
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/expenses:
    get:
      operationId: listExpenses
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createExpense
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ExpenseMutation' }
      responses:
        '201': { $ref: '#/components/responses/ExpenseResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /expenses/{expenseId}:
    get:
      operationId: getExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200': { $ref: '#/components/responses/ExpenseResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ExpenseMutation' }
      responses:
        '200': { $ref: '#/components/responses/ExpenseResponse' }
        '409': { $ref: '#/components/responses/ConflictResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonMutation' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '409': { $ref: '#/components/responses/ConflictResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /expenses/{expenseId}/adjustments:
    post:
      operationId: createExpenseAdjustment
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/AdjustmentMutation' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /rates:
    get:
      operationId: getRate
      parameters:
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: effective_date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /expenses/{expenseId}/rate-override:
    post:
      operationId: overrideExpenseRate
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/RateMutation' }
      responses:
        '200': { $ref: '#/components/responses/ExpenseResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /expenses/{expenseId}/reconcile:
    post:
      operationId: reconcileExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReconcileMutation' }
      responses:
        '200': { $ref: '#/components/responses/ExpenseResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/settlements:
    post:
      operationId: calculateSettlement
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /settlements/{settlementId}:
    get:
      operationId: getSettlement
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /repayments:
    post:
      operationId: proposeRepayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/RepaymentMutation' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /repayments/{repaymentId}/confirm:
    post:
      operationId: confirmRepayment
      parameters:
        - $ref: '#/components/parameters/RepaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /repayments/{repaymentId}/reverse:
    post:
      operationId: reverseRepayment
      parameters:
        - $ref: '#/components/parameters/RepaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonMutation' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/reports:
    post:
      operationId: requestTripReport
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '202': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /reports/{reportId}:
    get:
      operationId: getReportStatus
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Private A4 PDF
          content:
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /sync/batch:
    post:
      operationId: syncOperations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SyncBatch' }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /sync/changes:
    get:
      operationId: getSyncChanges
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      operationId: updateNotificationState
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/NotificationMutation' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /push-subscriptions:
    post:
      operationId: createPushSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/PushSubscription' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      operationId: deletePushSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/MutationOnly' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /expenses/{expenseId}/receipts:
    post:
      operationId: uploadReceipt
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [client_operation_id, file]
              properties:
                client_operation_id: { $ref: '#/components/schemas/Uuid' }
                file: { type: string, contentEncoding: binary }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /receipts/{receiptId}:
    get:
      operationId: getReceipt
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Authorized receipt bytes
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      operationId: deleteReceipt
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonMutation' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /receipts/{receiptId}/process:
    post:
      operationId: processReceipt
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReceiptProcessMutation' }
      responses:
        '202': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /receipts/{receiptId}/processing:
    get:
      operationId: getReceiptProcessing
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /receipts/{receiptId}/retry:
    post:
      operationId: retryReceiptProcessing
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReceiptProcessMutation' }
      responses:
        '202': { $ref: '#/components/responses/JsonResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /receipts/{receiptId}/apply-suggestions:
    post:
      operationId: applyReceiptSuggestions
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ApplySuggestions' }
      responses:
        '200': { $ref: '#/components/responses/ExpenseResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PACKTALLY_SESSION
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
    TripId: { name: tripId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MemberId: { name: memberId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ExpenseId: { name: expenseId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PasskeyId: { name: passkeyId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Month: { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 32, maxLength: 256 } }
    SettlementId: { name: settlementId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    RepaymentId: { name: repaymentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReceiptId: { name: receiptId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  requestBodies:
    MutationOnly:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MutationBase' } } }
    SetupOwner:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SetupOwnerCommand' } } }
    ClaimInvitation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ClaimInvitationCommand' } } }
    LoginOptions:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginOptionsCommand' } } }
    WebAuthnVerify:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnVerifyCommand' } } }
    TripMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/TripCommand' } } }
    MemberMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MemberCommand' } } }
    LifecycleMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleCommand' } } }
    ReasonMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReasonCommand' } } }
    ExpenseMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseCommand' } } }
    AdjustmentMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentCommand' } } }
    RateMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RateCommand' } } }
    ReconcileMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileCommand' } } }
    RepaymentMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RepaymentCommand' } } }
    SyncBatch:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SyncBatchCommand' } } }
    NotificationMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/NotificationCommand' } } }
    PushSubscription:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PushCommand' } } }
    ReceiptProcessMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptProcessCommand' } } }
    ApplySuggestions:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ApplySuggestionsCommand' } } }
  responses:
    JsonResponse:
      description: Successful response
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    ListResponse:
      description: Cursor-paginated response
      content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } }
    AccountResponse:
      description: Account response
      content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } }
    TripResponse:
      description: Trip response
      content: { application/json: { schema: { $ref: '#/components/schemas/TripEnvelope' } } }
    ExpenseResponse:
      description: Expense response
      content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseEnvelope' } } }
    CapabilitiesResponse:
      description: Safe deployment capabilities
      content: { application/json: { schema: { $ref: '#/components/schemas/CapabilitiesEnvelope' } } }
    ConflictResponse:
      description: Revision conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ConflictEnvelope' } } }
    ErrorResponse:
      description: Standard error response
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Uuid: { type: string, format: uuid }
    MutationBase:
      type: object
      required: [client_operation_id]
      properties:
        client_operation_id: { $ref: '#/components/schemas/Uuid' }
        expected_revision: { type: integer, minimum: 1 }
    Money:
      type: object
      required: [minor, currency]
      properties:
        minor: { type: string, pattern: '^-?[0-9]+$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Rate:
      type: object
      required: [base_currency, quote_currency, numerator, denominator, effective_date]
      properties:
        base_currency: { type: string, pattern: '^[A-Z]{3}$' }
        quote_currency: { type: string, const: IDR }
        numerator: { type: string, pattern: '^[0-9]+$' }
        denominator: { type: string, pattern: '^[1-9][0-9]*$' }
        effective_date: { type: string, format: date }
    AllocationInput:
      type: object
      required: [member_id, method, value]
      properties:
        member_id: { $ref: '#/components/schemas/Uuid' }
        method: { enum: [equal, exact, percentage, weight] }
        value: { type: string, pattern: '^[0-9]+(?:\.[0-9]{1,9})?$' }
    SetupOwnerCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [setup_secret, login_handle, first_name, attestation]
          properties:
            setup_secret: { type: string, minLength: 32 }
            login_handle: { type: string, minLength: 3, maxLength: 64 }
            first_name: { type: string, minLength: 1, maxLength: 80 }
            attestation: { type: object }
    ClaimInvitationCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [login_handle, first_name, attestation]
          properties:
            login_handle: { type: string, minLength: 3, maxLength: 64 }
            first_name: { type: string, minLength: 1, maxLength: 80 }
            attestation: { type: object }
    LoginOptionsCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [login_handle]
          properties:
            login_handle: { type: string, minLength: 3, maxLength: 64 }
    WebAuthnVerifyCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [challenge_id, credential]
          properties:
            challenge_id: { $ref: '#/components/schemas/Uuid' }
            credential: { type: object }
    TripCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [name, destination_timezone]
          properties:
            name: { type: string, minLength: 1, maxLength: 160 }
            destination_timezone: { type: string, minLength: 3, maxLength: 64 }
    MemberCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [action]
          properties:
            action: { enum: [revoke, leave, transfer_ownership, rename] }
            display_name: { type: string, minLength: 1, maxLength: 80 }
            reason: { type: string, minLength: 1, maxLength: 500 }
    LifecycleCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [target, reason]
          properties:
            target: { enum: [draft, active, settling, closed] }
            reason: { type: string, minLength: 1, maxLength: 500 }
    ReasonCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [reason]
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
    ExpenseCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [payer_member_id, expense_date, expense_timezone, merchant, amount, shares]
          properties:
            payer_member_id: { $ref: '#/components/schemas/Uuid' }
            expense_date: { type: string, format: date }
            expense_timezone: { type: string, minLength: 3, maxLength: 64 }
            merchant: { type: string, minLength: 1, maxLength: 200 }
            description: { type: string, maxLength: 1000 }
            amount: { $ref: '#/components/schemas/Money' }
            shares: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/AllocationInput' } }
            reason: { type: string, maxLength: 500 }
    AdjustmentCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [kind, amount, reason]
          properties:
            kind: { enum: [refund, fee, fx_fee, tip, discount, correction] }
            amount: { $ref: '#/components/schemas/Money' }
            reason: { type: string, minLength: 1, maxLength: 500 }
    RateCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [rate, reason]
          properties:
            rate: { $ref: '#/components/schemas/Rate' }
            reason: { type: string, minLength: 1, maxLength: 500 }
    ReconcileCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [actual_idr, reason]
          properties:
            actual_idr: { $ref: '#/components/schemas/Money' }
            reason: { type: string, minLength: 1, maxLength: 500 }
    RepaymentCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [trip_id, payer_member_id, recipient_member_id, amount, payment_date, payment_timezone]
          properties:
            trip_id: { $ref: '#/components/schemas/Uuid' }
            payer_member_id: { $ref: '#/components/schemas/Uuid' }
            recipient_member_id: { $ref: '#/components/schemas/Uuid' }
            amount: { $ref: '#/components/schemas/Money' }
            payment_date: { type: string, format: date }
            payment_timezone: { type: string, minLength: 3, maxLength: 64 }
    SyncOperation:
      type: object
      required: [client_operation_id, method, route, body]
      properties:
        client_operation_id: { $ref: '#/components/schemas/Uuid' }
        method: { enum: [POST, PATCH, DELETE] }
        route: { type: string, pattern: '^/api/' }
        body: { type: object }
    SyncBatchCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [operations]
          properties:
            operations: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/SyncOperation' } }
    NotificationCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [notification_ids, action]
          properties:
            notification_ids: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Uuid' } }
            action: { enum: [read, acknowledge, dismiss] }
    PushCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [endpoint, keys]
          properties:
            endpoint: { type: string, format: uri, maxLength: 2048 }
            keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }
    ReceiptProcessCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [operations]
          properties:
            operations: { type: array, minItems: 1, uniqueItems: true, items: { enum: [ocr, translate_en, translate_id] } }
    ApplySuggestionsCommand:
      allOf:
        - $ref: '#/components/schemas/MutationBase'
        - type: object
          required: [expected_expense_revision, fields]
          properties:
            expected_expense_revision: { type: integer, minimum: 1 }
            fields: { type: array, minItems: 1, uniqueItems: true, items: { enum: [merchant, expense_date, currency, amount] } }
    Account:
      type: object
      required: [id, login_handle, first_name, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        login_handle: { type: string }
        first_name: { type: string }
        status: { enum: [active, recovery, deleted] }
    Trip:
      type: object
      required: [id, name, report_currency, lifecycle, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        report_currency: { type: string, const: IDR }
        lifecycle: { enum: [draft, active, settling, closed, deleting] }
        revision: { type: integer, minimum: 1 }
    Expense:
      type: object
      required: [id, trip_id, payer_member_id, expense_date, expense_timezone, merchant, amount, shares, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        trip_id: { $ref: '#/components/schemas/Uuid' }
        payer_member_id: { $ref: '#/components/schemas/Uuid' }
        expense_date: { type: string, format: date }
        expense_timezone: { type: string }
        merchant: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        shares: { type: array, items: { $ref: '#/components/schemas/AllocationInput' } }
        revision: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        retryable: { type: boolean }
        retry_after_seconds: { type: [integer, 'null'], minimum: 0 }
        details: { type: object }
    SuccessEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data: { type: object }
        request_id: { $ref: '#/components/schemas/Uuid' }
    ListEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items: { type: array, maxItems: 50, items: {} }
            next_cursor: { type: [string, 'null'] }
        request_id: { $ref: '#/components/schemas/Uuid' }
    AccountEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/Account' }
        request_id: { $ref: '#/components/schemas/Uuid' }
    TripEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/Trip' }
        request_id: { $ref: '#/components/schemas/Uuid' }
    ExpenseEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data: { $ref: '#/components/schemas/Expense' }
        request_id: { $ref: '#/components/schemas/Uuid' }
    CapabilitiesEnvelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [pwa, in_app_notifications, web_push, ocr, translation, rate_lookup]
          properties:
            pwa: { type: boolean }
            in_app_notifications: { type: boolean }
            web_push: { enum: [available, disabled, unhealthy] }
            ocr: { enum: [available, disabled, unhealthy] }
            translation: { enum: [available, disabled, unhealthy] }
            rate_lookup: { enum: [available, disabled, unhealthy] }
        request_id: { $ref: '#/components/schemas/Uuid' }
    ConflictEnvelope:
      type: object
      required: [ok, error, request_id]
      properties:
        ok: { const: false }
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              required: [current, current_revision, conflicting_fields]
              properties:
                current: { type: object }
                current_revision: { type: integer, minimum: 1 }
                conflicting_fields: { type: array, items: { type: string }, uniqueItems: true }
        request_id: { $ref: '#/components/schemas/Uuid' }
    ErrorEnvelope:
      type: object
      required: [ok, error, request_id]
      properties:
        ok: { const: false }
        error: { $ref: '#/components/schemas/Error' }
        request_id: { $ref: '#/components/schemas/Uuid' }
