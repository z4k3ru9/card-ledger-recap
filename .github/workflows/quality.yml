name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:php
      - run: npm run build
      - run: find api -path 'api/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer validate --strict
        working-directory: api
      - run: composer audit --locked
        working-directory: api
